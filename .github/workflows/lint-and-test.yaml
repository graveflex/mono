name: lint and test

on:
  workflow_call:

permissions:
  pull-requests: write
  contents: read
  packages: read

jobs:
  test-suite:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: npm i -g --force corepack && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install

      - name: Extract Playwright version
        id: playwright-version
        shell: bash
        run: echo "PLAYWRIGHT_VERSION=$(jq -r '.devDependencies.playwright' apps/web/package.json)" >> $GITHUB_ENV

      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright dependencies
        shell: bash
        run: pnpm dlx playwright@$PLAYWRIGHT_VERSION install --with-deps --only-shell

      - name: ci
        env:
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_xxxxxxxxxxxxxxxx_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          BLOB_STORE_ID: "xxxxxxxxxxxxxxxx"
        id: ci
        run: pnpm cicd

