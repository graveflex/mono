version: '3.8'

services:
  db:
    image: postgres:17
    env_file: ".env.docker"
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust

  web:
    env_file: ".env.docker"
    build:
      context: .
      dockerfile: apps/web/web.dev.Dockerfile
    depends_on:
      - db
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/images
    command: ["pnpm", "dev:docker"]

  web-debug:
    env_file: ".env.docker"
    build:
      context: .
      dockerfile: apps/web/web.dev.Dockerfile
    depends_on:
      - db
    ports:
      - "3000:3000"
      - "3001:3001"
      - "9229:9229"
      - "9230:9230"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/images
    command: ["pnpm", "dev:docker:debug"]

volumes:
  pgdata:
